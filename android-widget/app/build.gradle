plugins { id 'com.android.application' }
android {
    namespace 'at.treeandme.widget'
    compileSdk 35
    defaultConfig {
        applicationId 'at.treeandme.widget'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Spielregeln (zugänglich / Obst) aus der Web-App übernehmen
tasks.register('copyRegeln', Copy) { from '../../regeln.json'; into 'src/main/assets' }
preBuild.dependsOn copyRegeln
