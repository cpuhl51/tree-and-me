name: Baumstatistik aktualisieren
on:
  schedule:
    - cron: "23 2 * * *"   # täglich ca. 3:23 Uhr Wiener Zeit
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_stats.py
      - name: Änderungen speichern
        run: |
          git config user.name "baumstatistik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Baumstatistik aktualisiert" && git push)
