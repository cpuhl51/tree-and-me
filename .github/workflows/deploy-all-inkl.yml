# Lädt App + Schnittstelle bei jedem Push auf main per FTPS zu all-inkl hoch.
# Zugangsdaten nur als GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USER, FTP_PASSWORD
# Solange die Secrets fehlen, wird der Upload einfach übersprungen.
name: Deploy all-inkl

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-all-inkl

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Paket zusammenstellen
        run: |
          mkdir -p paket/api
          cp index.html sw.js manifest.webmanifest datenschutz.html *.png paket/
          cp -r server/api/. paket/api/
          rm -f paket/api/config.php
          rm -rf paket/api/daten

      - name: PHP-Syntax prüfen
        run: for f in $(find paket/api -name '*.php'); do php -l "$f"; done

      - name: Hochladen
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./paket/
          server-dir: ./
          # Löscht nur Dateien, die diese Action selbst hochgeladen hat.
          # config.php und der Ordner daten/ am Server bleiben unangetastet.
          exclude: |
            **/config.php
            **/daten/**
