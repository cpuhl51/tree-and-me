<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree and me</title>
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --green:#2f6b3a; --green2:#e6f1e7; --ink:#1d241e; --quiet:#5d6b5f; --bg:#fff; --line:#d9e0da; --warn:#b26a00; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--green); color:#fff; z-index:1000; }
  header h1 { font-size:17px; margin:0; flex:1; display:flex; align-items:center; gap:8px; }
  header .logo { width:34px; height:34px; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:8px 10px; font-size:14px; }
  #pts { font-weight:700; font-size:15px; }
  #map { position:fixed; top:52px; bottom:0; left:0; right:0; }
  #fab { position:fixed; right:12px; bottom:20px; z-index:900; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  #fab button, #fab label { background:#fff; border:1px solid var(--line); border-radius:24px; padding:10px 14px; font-size:14px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #hint { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:900; background:#fff; border:1px solid var(--line); border-radius:16px; padding:6px 12px; font-size:13px; color:var(--quiet); display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:1100; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -2px 12px rgba(0,0,0,.2); padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:70vh; overflow-y:auto; }
  .panel { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:1050; background:#fff; overflow-y:auto; padding:16px; }
  .hidden { display:none !important; }
  .sheet h2, .panel h2 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--quiet); font-size:13px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; margin:10px 0; }
  .grid b { color:var(--quiet); font-weight:500; }
  .btn { display:block; width:100%; margin-top:8px; padding:13px; border-radius:10px; border:0; font-size:15px; font-weight:600; background:var(--green); color:#fff; }
  .btn.sec { background:var(--green2); color:var(--green); }
  .btn.ghost { background:none; color:var(--quiet); font-weight:500; }
  .btn:disabled { opacity:.45; }
  .ok { background:var(--green2); color:var(--green); padding:10px; border-radius:10px; font-size:14px; margin:8px 0; }
  .warn { background:#fff4e0; color:var(--warn); padding:10px; border-radius:10px; font-size:14px; margin:8px 0; }
  .close { float:right; background:none; border:0; font-size:22px; color:var(--quiet); }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:1300; background:#1d241e; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; max-width:90vw; text-align:center; }
  #live { position:fixed; inset:0; z-index:1450; background:#000; }
  #live video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #liveGuide { position:absolute; left:50%; top:42%; width:64vw; height:64vw; max-width:360px; max-height:360px; transform:translate(-50%,-50%); border:3px solid #fff; border-radius:18px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); transition:border-color .2s; }
  #liveGuide.hit { border-color:#7ccf5a; }
  #liveMsg { position:absolute; left:16px; right:16px; top:calc(42% + min(32vw,180px) + 16px); color:#fff; text-align:center; font-size:15px; }
  #liveBar { position:absolute; left:16px; right:16px; bottom:calc(24px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  #liveBar .btn { margin:0; }
  #outside { position:fixed; left:12px; right:12px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:950; background:#fff; border:2px solid #1a5fd0; border-radius:14px; padding:14px 16px; font-size:15px; line-height:1.4; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  #outside b { color:#1a5fd0; }
  .arrow-ic { background:none; border:0; }
  #busy { position:fixed; inset:0; z-index:1400; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  .tree-ic.closed { filter:grayscale(1) opacity(.45); }
  .tree-ic { font-size:22px; line-height:28px; text-align:center; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .tree-ic.visited { background:rgba(47,107,58,.25); border:2px solid var(--green); border-radius:50%; }
  table.stat { width:100%; border-collapse:collapse; font-size:14px; margin:6px 0 16px; }
  table.stat td { border-bottom:1px solid var(--line); padding:6px 4px; }
  table.stat td:last-child { text-align:right; }
  .big { font-size:28px; font-weight:700; color:var(--green); }
  .small { font-size:12px; color:var(--quiet); }
  img.thumb { max-width:100%; border-radius:10px; margin-top:8px; }
  .grid a, .meta a { color:var(--green); }
  #btnMe { padding:0; width:34px; height:34px; border-radius:50%; overflow:hidden; font-weight:700; font-size:15px; }
  #btnMe img { width:100%; height:100%; object-fit:cover; display:block; }
  .av { width:96px; height:96px; border-radius:50%; background:var(--green2); color:var(--green); display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; overflow:hidden; margin:12px 0; }
  .av img { width:100%; height:100%; object-fit:cover; }
  input.txt { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; }
  .chk { display:flex; gap:8px; align-items:flex-start; font-size:14px; margin:10px 0; }
  .chk input { margin-top:3px; }
  #filter { position:fixed; top:60px; left:12px; z-index:900; display:flex; background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #filter button { border:0; background:none; padding:8px 12px; font-size:13px; color:var(--quiet); }
  #filter button.on { background:var(--green); color:#fff; font-weight:600; }
  #hint { top:104px !important; }
  .heart-ic { background:none; border:0; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .vlist button { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px 4px; font-size:14px; color:var(--ink); }
  .vlist .small { display:block; }
  #cropper { position:fixed; inset:0; z-index:1500; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  #cropBox { width:280px; height:280px; border-radius:50%; overflow:hidden; touch-action:none; box-shadow:0 0 0 3px #fff; }
  #cropper input[type=range] { width:280px; }
  #cropper .row { display:flex; gap:10px; width:280px; }
  .info { display:flex; gap:10px; align-items:flex-end; }
  .info .grid { flex:1; min-width:0; }
  .info svg { flex:0 0 auto; width:118px; height:auto; }
  details.grp { border-bottom:1px solid var(--line); }
  details.grp summary { display:flex; justify-content:space-between; padding:9px 4px; font-size:14px; cursor:pointer; list-style:none; }
  details.grp summary::-webkit-details-marker { display:none; }
  details.grp summary::before { content:'▸'; color:var(--quiet); margin-right:8px; }
  details.grp[open] summary::before { content:'▾'; }
  details.grp summary span:first-child { flex:1; }
  details.grp .btn { margin:4px 0 10px; padding:9px; font-size:14px; }
  #subsetChip { position:fixed; top:104px; left:12px; z-index:900; background:var(--green); color:#fff; border:0; border-radius:16px; padding:6px 12px; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .gallery { border:1px dashed var(--line); border-radius:10px; padding:10px; font-size:13px; color:var(--quiet); margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1><img src="logo-96.png" alt="" class="logo">Tree and me</h1>
  <span id="pts">0 P</span>
  <button id="btnMe" title="Profil">?</button>
  <button id="btnStats">Statistik</button>
</header>
<div id="map"></div>
<div id="hint"></div>
<div id="filter">
  <button data-m="all" class="on">Alle</button><button data-m="open">Offen</button><button data-m="visited">Besucht</button>
</div>
<button id="subsetChip" class="hidden" onclick="clearSubset()"></button>
<div id="fab">
  <label><input type="checkbox" id="testMode"> Testmodus</label>
  <button id="btnLocate">◎ Mein Standort</button>
</div>
<div id="sheet" class="sheet hidden"></div>
<div id="stats" class="panel hidden"></div>
<div id="toast"></div>
<div id="live" class="hidden">
  <video id="liveVideo" playsinline muted></video>
  <div id="liveGuide"></div>
  <div id="liveMsg">Halte die Plakette in den Rahmen</div>
  <div id="liveBar"><button class="btn ghost" style="color:#ddd;background:rgba(255,255,255,.12)" id="liveCancel">Abbrechen</button><button class="btn sec hidden" id="liveTorch" style="flex:0 0 56px">🔦</button><button class="btn" id="liveShot">📷 Foto machen</button></div>
</div>
<div id="outside" class="hidden"></div>
<div id="busy" class="hidden">Bitte warten …</div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="avInput" accept="image/*" hidden>
<div id="profile" class="panel hidden"></div>
<div id="cropper" class="hidden">
  <div style="color:#fff;font-size:15px">Bild verschieben und zoomen</div>
  <div id="cropBox"><canvas id="cropCv" width="560" height="560" style="width:280px;height:280px"></canvas></div>
  <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1">
  <div class="row"><button class="btn ghost" style="color:#ccc" id="cropCancel">Abbrechen</button><button class="btn" id="cropOk">Übernehmen</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// ---------- Einstellungen ----------
const CFG = {
  radius: 15,          // max. Abstand zum Baum in Metern
  matchRadius: 30,     // Umkreis, in dem eine gelesene Nummer gesucht wird
  minZoom: 16,         // ab dieser Zoomstufe werden Bäume geladen
  maxFeatures: 1500,
  wfs: 'https://data.wien.gv.at/daten/geo', // später ggf. eigener Server/Worker
  reportWorkdays: 3,
  ma42Mail: 'post@ma42.wien.gv.at',
  sagsWienPkg: 'at.gv.wien.sagswien.app.droid',
  googleClientId: '' // aus der Google Cloud Console (Google Auth Platform → Clients) eintragen
};

// ---------- Speicher ----------
const STORE_KEY = 'tam_v1';
let state = loadState();
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || freshState(); } catch { return freshState(); }
}
function freshState() { return { visits: {}, districts: [] }; }
function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); renderPoints(); }

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tam', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function putPhoto(key, blob) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function getPhoto(key) {
  const db = await idb();
  return new Promise((res, rej) => { const r = db.transaction('photos').objectStore('photos').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}

// ---------- Hilfen ----------
const $ = id => document.getElementById(id);
function toast(msg, ms = 2800) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
function busy(on, txt) { $('busy').textContent = txt || 'Bitte warten …'; $('busy').classList.toggle('hidden', !on); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function addWorkdays(date, n) { // ohne Feiertage (Annahme für den Prototyp)
  const d = new Date(date);
  while (n > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n--; }
  return d;
}
const fmtDate = d => new Date(d).toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric' });
const normNum = s => String(s ?? '').replace(/\D/g, '').replace(/^0+/, '');

// ---------- Baum-Kategorien ----------
// Regeln (zugänglich / Nadel / essbares Obst) und Wien-Statistik kommen aus regeln.json und stats.json
let RULES = { closed: new Set(), nadel: new Set(), essbar: [] }, STATS = null;
const rulesReady = (async () => {
  try {
    const r = await (await fetch('regeln.json', { cache: 'no-cache' })).json();
    RULES = { closed: new Set(r.nicht_zugaenglich), nadel: new Set(r.nadel_gattungen), essbar: r.obst_essbar.map(p => new RegExp(p)) };
  } catch (e) { console.warn('Regeln nicht geladen', e); }
  try { STATS = await (await fetch('stats.json', { cache: 'no-cache' })).json(); } catch (e) { console.warn('Statistik nicht geladen', e); }
  // gespeicherte Besuche mit den aktuellen Regeln neu einordnen
  for (const v of Object.values(state.visits)) v.kat = category(v.art);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  setTimeout(() => { // Karten-Symbole mit den neuen Regeln neu zeichnen
    for (const [k, m] of visitedMarkers) if (state.visits[k]) m.setIcon(visitedIcon(state.visits[k].kat));
    for (const t of trees.values()) t.marker.setIcon(iconFor(t));
    refreshMarkers();
  });
})();
function category(art) {
  const a = String(art || '').trim();
  if (RULES.nadel.has(genusOf(a).toLowerCase())) return 'nadel';
  if (RULES.essbar.some(re => re.test(a))) return 'obst'; // nur Bäume mit essbaren Früchten
  return 'laub'; // inkl. Ginkgo und Zierobst
}
const accessible = p => !RULES.closed.has(p.GEBIETSGRUPPE);
const groupLabel = g => String(g || '').replace(/^MA \d+ - /, '');
const EMOJI = { laub:'🌳', nadel:'🌲', obst:'🍎' };
const KAT_NAME = { laub:'Laubbaum', nadel:'Nadelbaum', obst:'Obstbaum' };
const genusOf = art => (String(art || '').trim().split(/\s+/)[0] || 'unbekannt');

// ---------- Karte ----------
const map = L.map('map', { zoomControl: false }).setView([48.2082, 16.3738], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20, maxNativeZoom: 19,
  attribution: '© OpenStreetMap · Baumdaten: Stadt Wien – data.wien.gv.at (CC BY 4.0)'
}).addTo(map);

const trees = new Map();    // key -> {key, props, latlng, marker}
let me = null, meMarker = null, accCircle = null, selected = null;

function treeKey(p) { return `${p.BEZIRK}|${p.OBJEKT_STRASSE}|${p.BAUMNUMMER}`; }

function iconFor(t) {
  return L.divIcon({ className: 'tree-ic' + (accessible(t.props) ? '' : ' closed'), html: EMOJI[category(t.props.GATTUNG_ART)], iconSize: [30, 30] });
}
const HEART = c => `<svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 28C7 21 2 16 2 10.5 2 6.4 5.2 3.5 9 3.5c2.8 0 5.2 1.6 7 4 1.8-2.4 4.2-4 7-4 3.8 0 7 2.9 7 7 0 5.5-5 10.5-14 17.5z" fill="${c}" stroke="#fff" stroke-width="2"/></svg>`;
const CORE = `<svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 5c0-2 1-3 3-3.5" stroke="#6b4a2b" stroke-width="2" fill="none"/><path d="M19 4.5c2-2 4.5-1.5 5.5-.5-1.5 1.5-3.5 2-5.5.5z" fill="#4caf50"/><path d="M7 8c2-3 6-3.5 9-3.5S23 5 25 8c-3 1-4.5 3.5-4.5 8s1.5 7 4.5 8c-2 3-6 4-9 4s-7-1-9-4c3-1 4.5-3.5 4.5-8S10 9 7 8z" fill="#f6ecc4" stroke="#fff" stroke-width="1.5"/><path d="M7 8c2-3 6-3.5 9-3.5S23 5 25 8c-3 .8-6 1.2-9 1.2S10 8.8 7 8z" fill="#d93a2b"/><path d="M7 24c3-.8 6-1.2 9-1.2s6 .4 9 1.2c-2 3-6 4-9 4s-7-1-9-4z" fill="#d93a2b"/><ellipse cx="14" cy="16" rx="1.2" ry="2" fill="#5b3a1e"/><ellipse cx="18" cy="16" rx="1.2" ry="2" fill="#5b3a1e"/></svg>`;
function visitedIcon(kat) {
  const html = kat === 'obst' ? CORE : HEART(kat === 'nadel' ? '#1f5e2c' : '#7ccf5a');
  return L.divIcon({ className: 'heart-ic', html, iconSize: [30, 30] });
}
const openLayer = L.layerGroup().addTo(map), visitedLayer = L.layerGroup().addTo(map);
const visitedMarkers = new Map();
let mode = 'all', subset = null; // subset = {label, keys:Set} aus der Statistik
function treeFromVisit(v) {
  return trees.get(v.key) || { key: v.key, latlng: L.latLng(v.lat, v.lon),
    props: v.props || { BAUMNUMMER: v.nummer, GATTUNG_ART: v.art, BEZIRK: v.bezirk, OBJEKT_STRASSE: v.strasse } };
}
function onTreeClick(t) {
  if ($('testMode').checked) { selected = t; setMe(t.latlng, 5); checkOutside(t.latlng); } // Testmodus: Standort = dieser Baum
  openTree(t);
}
function refreshMarkers() {
  // besuchte Bäume: immer vorhanden, unabhängig vom Zoom
  for (const [k, m] of visitedMarkers) if (!state.visits[k]) { visitedLayer.removeLayer(m); visitedMarkers.delete(k); }
  for (const v of Object.values(state.visits)) {
    if (!visitedMarkers.has(v.key)) visitedMarkers.set(v.key, L.marker([v.lat, v.lon], { icon: visitedIcon(v.kat || category(v.art)), zIndexOffset: 500 })
      .on('click', () => onTreeClick(treeFromVisit(v))));
    const m = visitedMarkers.get(v.key), show = !subset || subset.keys.has(v.key);
    if (show && !visitedLayer.hasLayer(m)) visitedLayer.addLayer(m);
    if (!show && visitedLayer.hasLayer(m)) visitedLayer.removeLayer(m);
  }
  // offene Bäume
  for (const t of trees.values()) {
    const show = !state.visits[t.key] && (mode !== 'open' || accessible(t.props)); // „Offen“ zeigt nur Spielbares
    if (show && !openLayer.hasLayer(t.marker)) openLayer.addLayer(t.marker);
    if (!show && openLayer.hasLayer(t.marker)) openLayer.removeLayer(t.marker);
  }
  map[mode === 'open' ? 'removeLayer' : 'addLayer'](visitedLayer);
  map[mode === 'visited' || subset ? 'removeLayer' : 'addLayer'](openLayer);
}
document.querySelectorAll('#filter button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('#filter button').forEach(x => x.classList.toggle('on', x === b));
  refreshMarkers();
  if (mode === 'visited') { showHint(Object.keys(state.visits).length ? '' : 'Noch keine besuchten Bäume'); }
  else loadTrees();
});

let loadTimer = null, loading = false;
map.on('moveend', () => { clearTimeout(loadTimer); loadTimer = setTimeout(loadTrees, 400); });

async function loadTrees() {
  await rulesReady;
  if (mode === 'visited') return;
  if (map.getZoom() < CFG.minZoom) { showHint(wasOutside ? '' : 'Näher hineinzoomen, um Bäume zu sehen'); return; }
  showHint('');
  if (loading) return; loading = true;
  const b = map.getBounds();
  const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v => v.toFixed(6)).join(',');
  const url = `${CFG.wfs}?service=WFS&request=GetFeature&version=1.0.0&typeName=ogdwien:BAUMKATOGD&srsName=EPSG:4326&outputFormat=json&maxFeatures=${CFG.maxFeatures}&bbox=${bbox},EPSG:4326`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const gj = await r.json();
    for (const f of gj.features || []) {
      const p = f.properties || {}; const c = f.geometry && f.geometry.coordinates;
      if (!c) continue;
      const key = treeKey(p);
      if (trees.has(key)) continue;
      const t = { key, props: p, latlng: L.latLng(c[1], c[0]) };
      t.marker = L.marker(t.latlng, { icon: iconFor(t) }).on('click', () => onTreeClick(t));
      trees.set(key, t);
    }
    refreshMarkers();
    if ((gj.features || []).length >= CFG.maxFeatures) showHint('Sehr viele Bäume – näher zoomen für alle');
  } catch (e) {
    console.error(e);
    toast('Baumdaten konnten nicht geladen werden (' + e.message + ')', 4500);
  } finally { loading = false; }
}
function showHint(txt) { const h = $('hint'); h.textContent = txt; h.style.display = txt ? 'block' : 'none'; }

function inWien(ll) {
  let inside = false;
  for (let i = 0, j = WIEN.length - 1; i < WIEN.length; j = i++) {
    const [ai, bi] = WIEN[i], [aj, bj] = WIEN[j];
    if ((bi > ll.lng) !== (bj > ll.lng) && ll.lat < (aj - ai) * (ll.lng - bi) / (bj - bi) + ai) inside = !inside;
  }
  return inside;
}
function nearestBorder(ll) { // nächster Punkt auf der Stadtgrenze (flache Näherung, reicht für Kilometer)
  const kx = Math.cos(ll.lat * Math.PI / 180);
  let best = null, bd = Infinity;
  for (let i = 0; i < WIEN.length; i++) {
    const a = WIEN[i], b = WIEN[(i + 1) % WIEN.length];
    const ax = a[1] * kx, ay = a[0], bx = b[1] * kx, by = b[0], px = ll.lng * kx, py = ll.lat;
    const t = Math.max(0, Math.min(1, ((px - ax) * (bx - ax) + (py - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2 || 1)));
    const qx = ax + t * (bx - ax), qy = ay + t * (by - ay), d = (px - qx) ** 2 + (py - qy) ** 2;
    if (d < bd) { bd = d; best = L.latLng(qy, qx / kx); }
  }
  return best;
}
function bearing(a, b) {
  const r = Math.PI / 180, y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r);

  return (Math.atan2(y, x) / r + 360) % 360;
}

function layoutFab() {
  const box = $('outside'), shown = !box.classList.contains('hidden');
  $('fab').style.bottom = shown ? (box.offsetHeight + 32) + 'px' : '';

function hideOutside() {

// Pfeil wächst/schrumpft mit dem Zoom und sitzt knapp außerhalb der Grenze, damit er Wien nicht verdeckt
function placeArrow() {
  if (!arrowState || !outsideLayer) return;
  const s = Math.round(Math.max(14, Math.min(64, 48 * Math.pow(2, map.getZoom() - 10))));
  const r = arrowState.deg * Math.PI / 180, p = map.latLngToContainerPoint(arrowState.edge);
  const off = s / 2 + 6, pos = map.containerPointToLatLng([p.x + Math.sin(r) * off, p.y - Math.cos(r) * off]);
  arrowState.marker.setLatLng(pos).setIcon(L.divIcon({ className: 'arrow-ic', iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    html: `<svg width="${s}" height="${s}" viewBox="0 0 64 64" style="transform:rotate(${arrowState.deg}deg)"><path d="M32 4 L52 30 H40 V60 H24 V30 H12 Z" fill="#1a5fd0" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>` }));
}
map.on('zoomend', placeArrow);
function checkOutside(ll) {
  const away = !inWien(ll);

  $('outside').classList.toggle('hidden', !away);
  if (!away) { wasOutside = false; layoutFab(); return false; }
  const world = [[-89, -179], [-89, 179], [89, 179], [89, -179]];
  const edge = nearestBorder(ll), km = dist(edge, ll) / 1000, deg = bearing(edge, ll);

  placeArrow();
  $('outside').innerHTML = `Dieses Spiel funktioniert ausschließlich in Wien. Du bist aktuell <b>${km < 1 ? 'weniger als 1' : Math.round(km).toLocaleString('de-AT')} Kilometer</b> entfernt. Bitte begib dich nach Wien, um zu spielen.`;
  layoutFab();

// ---------- Standort ----------
function setMe(latlng, acc) {
  me = { latlng, acc };
  if (!meMarker) {
    meMarker = L.circleMarker(latlng, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
    accCircle = L.circle(latlng, { radius: acc, color: '#1a73e8', weight: 1, fillOpacity: .08 }).addTo(map);
  } else { meMarker.setLatLng(latlng); accCircle.setLatLng(latlng).setRadius(acc); }
  updateDistance(); // nur Abstand + Knöpfe aktualisieren, Fenster nicht neu aufbauen
}
let firstFix = true;
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(pos => {
    if ($('testMode').checked) return;
    setMe(L.latLng(pos.coords.latitude, pos.coords.longitude), pos.coords.accuracy);
    const away = checkOutside(me.latlng);
    if (firstFix) { firstFix = false; if (!away) map.setView(me.latlng, 18); }
  }, err => toast('Kein GPS: ' + err.message + ' – Testmodus nutzen'), { enableHighAccuracy: true, maximumAge: 5000 });
}
$('btnLocate').onclick = () => { if (me) map.setView(me.latlng, 18); else toast('Noch kein Standort'); };
$('testMode').onchange = e => { if (e.target.checked) hideOutside(); else if (me && !$('testMode').checked) checkOutside(me.latlng); toast(e.target.checked ? 'Testmodus: Tippe auf einen Baum – du stehst dann direkt davor' : 'Testmodus aus – GPS aktiv'); };
map.on('click', e => { if ($('testMode').checked) { setMe(e.latlng, 5); checkOutside(e.latlng); } });

function inRange(t) {
  if (!me) return false;
  const allowed = CFG.radius + Math.min(me.acc || 0, 15);
  return dist(me.latlng, t.latlng) <= allowed;
}

let camMode = null, planBReason = null, lastPhoto = null;
function startCam(mode) { camMode = mode; const c = $('camInput'); c.value = ''; c.setAttribute('capture', mode === 'selfie' ? 'user' : 'environment'); c.click(); }
$('camInput').onchange = async e => {
  const file = e.target.files && e.target.files[0];

  const t = selected;
  if (camMode === 'selfie' || camMode === 'tree') {
    const blob = await shrink(file, 1600), v = state.visits[t.key], ts = new Date().toISOString();
    const id = `${camMode}:${t.key}:${ts}`;
    await putPhoto(id, blob);

  // OCR
  lastPhoto = await shrink(file, 1600);
  busy(true, 'Lese Plakette …');
  try {
    const numbers = await ocr(file);
    busy(false);
    if (!acceptHit(t, matchNumber(t, numbers), lastPhoto)) ocrFailed(t, numbers);
  } catch (err) {
    busy(false); console.error(err); ocrFailed(t, []);
  }

function acceptHit(t, hit, photo) {
  if (hit === t) { recordVisit(t, 'ocr', null, photo); return true; }
  if (hit) {
    if (confirm(`Die Plakette passt zu Baum Nr. ${hit.props.BAUMNUMMER} (${hit.props.GATTUNG_ART}) in der Nähe. Diesen Baum werten?`)) recordVisit(hit, 'ocr', null, photo);

  }
  return false;
}

async function recordVisit(t, method, reason, photo) {
  if (state.visits[t.key]) { toast('Diesen Baum hast du schon besucht – keine Punkte mehr'); return openTree(t); }
  const p = t.props, bez = String(p.BEZIRK);
  let pts = 0; const why = [];
  const report = method === 'planb' && (reason === 'fehlt' || reason === 'unlesbar');
  if (report) { pts += 5; why.push('Meldung +5 (vorläufig)'); }
  else { pts += 1; why.push('Besuch +1'); }
  if (!state.districts.includes(bez)) { pts += 10; why.push('neuer Bezirk +10'); state.districts.push(bez); }
  const now = new Date();
  state.visits[t.key] = {
    key: t.key, nummer: p.BAUMNUMMER, art: p.GATTUNG_ART, gattung: genusOf(p.GATTUNG_ART), kat: category(p.GATTUNG_ART),
    bezirk: bez, strasse: p.OBJEKT_STRASSE, lat: t.latlng.lat, lon: t.latlng.lng, ts: now.toISOString(),
    method, reason, points: pts, pending: report, pendingUntil: report ? addWorkdays(now, CFG.reportWorkdays).toISOString() : null,
    reportQueued: report, props: p
  };
  if (photo) await putPhoto('scan:' + t.key, photo);
  saveState();
  refreshMarkers();
  selected = t; openTree(t);
  toast('🎉 ' + why.join(' · ') + (report ? ' – Meldung an die Stadtgärten vorgemerkt' : ''), 4000);
}

function totals() {
  const v = Object.values(state.visits);
  const sure = v.filter(x => !x.pending).reduce((s, x) => s + x.points, 0);
  const pend = v.filter(x => x.pending).reduce((s, x) => s + x.points, 0);
  return { count: v.length, sure, pend, all: sure + pend };
}

// ---------- Wikipedia ----------
// Wissenschaftlicher Artname ohne Sorte, z. B. "Acer platanoides 'Globosum'" -> "Acer platanoides", "Tilia x euchlora" -> "Tilia × euchlora"
function speciesOf(art) {
  const latin = String(art || '').replace(/\(.*?\)/g, ' ').replace(/['‘’"„“].*$/, ' ').trim();
  const w = latin.split(/\s+/).filter(Boolean);
  if (w.length < 2) return '';
  if (/^(x|×)$/i.test(w[1]) && w[2]) return `${w[0]} × ${w[2].toLowerCase()}`;
  if (/^(spec|sp|spp|ssp|var)\.?$/i.test(w[1]) || !/^[a-zäöü-]+$/.test(w[1])) return '';
  return `${w[0]} ${w[1]}`;
}
const germanOf = art => ((String(art || '').match(/\(([^)]+)\)/) || [])[1] || '').trim();
function wikiCandidates(art) { return [...new Set([speciesOf(art), germanOf(art), genusOf(art)].filter(Boolean))]; }
function wikiSearchUrl(art) { return 'https://de.wikipedia.org/w/index.php?go=Go&search=' + encodeURIComponent(wikiCandidates(art)[0] || ''); }
const wikiCache = (() => { try { return JSON.parse(localStorage.getItem('tam_wiki')) || {}; } catch { return {}; } })();
// Fragt Wikipedia, welcher Kandidat ein echter Artikel ist (keine Begriffsklärung) und setzt den Link darauf
async function resolveWiki(art) {
  const set = title => { const a = $('wikiLink'); if (a && title) { a.href = 'https://de.wikipedia.org/wiki/' + encodeURIComponent(title.replace(/ /g, '_')); a.title = title; } };
  if (wikiCache[art]) return set(wikiCache[art]);
  const cands = wikiCandidates(art); if (!cands.length) return;
  try {
    const url = 'https://de.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageprops&ppprop=disambiguation&titles=' + encodeURIComponent(cands.join('|'));
    const j = await (await fetch(url)).json(), q = j.query || {};
    const map1 = {}; (q.normalized || []).forEach(n => map1[n.from] = n.to);
    const redir = {}; (q.redirects || []).forEach(r => redir[r.from] = r.to);
    const pages = Object.values(q.pages || {});
    for (const c of cands) {
      let t = map1[c] || c; t = redir[t] || t;
      const pg = pages.find(x => x.title === t);
      if (pg && !('missing' in pg) && !(pg.pageprops && 'disambiguation' in pg.pageprops)) {
        wikiCache[art] = t; try { localStorage.setItem('tam_wiki', JSON.stringify(wikiCache)); } catch {}
        return set(t);
      }
    }
  } catch (e) { /* offline: Suchlink bleibt */ }
}

// ---------- Avatar zuschneiden ----------
let crop = null;
function openCropper(img) {
  const base = 560 / Math.min(img.width, img.height); // Bild füllt den Kreis
  crop = { img, base, zoom: 1, x: 0, y: 0 };
  $('cropZoom').value = 1; drawCrop(); $('cropper').classList.remove('hidden');
}
function clampCrop() {
  const s = crop.base * crop.zoom, w = crop.img.width * s, h = crop.img.height * s;
  const mx = Math.max(0, (w - 560) / 2), my = Math.max(0, (h - 560) / 2);
  crop.x = Math.max(-mx, Math.min(mx, crop.x)); crop.y = Math.max(-my, Math.min(my, crop.y));
}
function drawCrop() {
  clampCrop();
  const ctx = $('cropCv').getContext('2d'), s = crop.base * crop.zoom, w = crop.img.width * s, h = crop.img.height * s;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 560, 560);
  ctx.drawImage(crop.img, 280 - w / 2 + crop.x, 280 - h / 2 + crop.y, w, h);
}
$('cropZoom').oninput = e => { crop.zoom = +e.target.value; drawCrop(); };
(() => {
  const box = $('cropBox'), pts = new Map(); let lastDist = 0;
  box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
  box.addEventListener('pointermove', e => {
    if (!crop || !pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { // Zwei-Finger-Zoom
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (lastDist) { crop.zoom = Math.max(1, Math.min(4, crop.zoom * d / lastDist)); $('cropZoom').value = crop.zoom; }
      lastDist = d;
    } else { crop.x += (e.clientX - prev[0]) * 2; crop.y += (e.clientY - prev[1]) * 2; }
    drawCrop();
  });
  const up = e => { pts.delete(e.pointerId); lastDist = 0; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
})();
$('cropCancel').onclick = () => $('cropper').classList.add('hidden');
$('cropOk').onclick = async () => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  c.getContext('2d').drawImage($('cropCv'), 0, 0, 560, 560, 0, 0, 256, 256);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  await putPhoto('avatar', blob);
  state.profile = Object.assign(state.profile || {}, { hasAvatar: true }); saveState();
  $('cropper').classList.add('hidden');
  if ($('avPrev')) $('avPrev').innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="">`;
  renderMe();
};

// ---------- Mit Google anmelden ----------
function renderGoogleButton(tries = 0) {
  if (!CFG.googleClientId || !$('gBtn')) return;
  if (!window.google || !google.accounts) { if (tries < 20) setTimeout(() => renderGoogleButton(tries + 1), 300); return; }
  google.accounts.id.initialize({ client_id: CFG.googleClientId, callback: onGoogleLogin });
  google.accounts.id.renderButton($('gBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'de', width: 280 });
}
async function onGoogleLogin(resp) {
  // Prototyp: Token wird nur gelesen; prüfen muss es später der Server
  const b64 = resp.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  const info = JSON.parse(decodeURIComponent(escape(atob(b64))));
  const pr = state.profile = state.profile || {};
  pr.google = { sub: info.sub, email: info.email };
  pr.id = pr.id || crypto.randomUUID();
  if (!pr.name && info.given_name) pr.name = (info.given_name.replace(/[^\p{L}\p{N}_-]/gu, '') + Math.floor(10 + Math.random() * 90)).slice(0, 20);
  saveState(); renderMe();
  await openProfile(false);
  if (!pr.hasAvatar && info.picture) {
    try { const r = await fetch(info.picture.replace(/=s\d+-c$/, '=s512-c')); openCropper(await createImageBitmap(await r.blob())); }
    catch (e) { toast('Google-Bild konnte nicht übernommen werden – bitte selbst wählen'); }
  }
  toast('Mit Google verbunden');
}

// ---------- Zu einem Baum springen ----------
function showSubset(field, val, label) {
  const keys = new Set(Object.values(state.visits).filter(x => String(x[field]) === val).map(x => x.key));
  subset = { label, keys };
  $('stats').classList.add('hidden'); closeSheet();
  $('subsetChip').textContent = `${label}: ${keys.size} ✕`; $('subsetChip').classList.remove('hidden');
  refreshMarkers();
  const pts = [...keys].map(k => [state.visits[k].lat, state.visits[k].lon]);
  if (pts.length === 1) map.setView(pts[0], 18); else map.fitBounds(pts, { padding: [40, 40], maxZoom: 18 });
}
function clearSubset() { subset = null; $('subsetChip').classList.add('hidden'); refreshMarkers(); loadTrees(); }

// ---------- Baum maßstäblich neben einem Einfamilienhaus ----------
// Größenklassen laut Baumkataster: Höhe bis „über 35 m“, Krone bis „über 21 m“ -> Zeichnung ausgelegt auf 40 m Höhe
const SC = { maxH: 40, W: 28 };
function rangeMid(txt, overVal) {
  const n = (String(txt || '').match(/\d+/g) || []).map(Number);
  if (!n.length) return null;
  if (/über|>/i.test(txt)) return overVal;
  return n.length > 1 ? (n[0] + n[1]) / 2 : n[0];
}
function treeSvg(p, kat) {
  const h = rangeMid(p.BAUMHOEHE_TXT, 38), cr = rangeMid(p.KRONENDURCHMESSER_TXT, 23);
  const U = Number(p.STAMMUMFANG) || 0;
  if (!h) return '';
  const H = SC.maxH + 2, G = SC.maxH, cx = 15.5;           // Koordinaten in Metern, Boden bei y = G
  const cw = Math.max(cr || h * 0.4, 1);                    // Kronendurchmesser
  const trunk = Math.max(U / 100 / Math.PI, 0.15) * 2;       // Stamm 2-fach überhöht, sonst unsichtbar
  const top = G - h;
  let crown;
  if (kat === 'nadel') {
    crown = `<path d="M${cx} ${top} L${cx + cw / 2} ${G - h * 0.12} L${cx - cw / 2} ${G - h * 0.12} Z"/>`;
  } else {
    const bottom = G - h * (kat === 'obst' ? 0.3 : 0.38);
    crown = `<ellipse cx="${cx}" cy="${(top + bottom) / 2}" rx="${cw / 2}" ry="${(bottom - top) / 2}"/>`;
  }
  // Haus: 10 m breit, 2 Geschosse (6 m) + Satteldach (3 m)
  const hx = 1, hw = 10, wall = 6, roof = 3;
  const win = (x, y) => `<rect x="${x}" y="${y}" width="1.6" height="1.6" fill="#fff"/>`;
  return `<svg viewBox="0 0 ${SC.W} ${H}" role="img" aria-label="Baum im Größenvergleich zu einem Einfamilienhaus">
    <g fill="#c4c9c5">
      <rect x="${hx}" y="${G - wall}" width="${hw}" height="${wall}"/>
      <path d="M${hx - 0.5} ${G - wall} L${hx + hw / 2} ${G - wall - roof} L${hx + hw + 0.5} ${G - wall} Z"/>
      ${win(hx + 1.5, G - 5.2)}${win(hx + 6.9, G - 5.2)}${win(hx + 1.5, G - 2.4)}
      <rect x="${hx + 7}" y="${G - 2.6}" width="1.4" height="2.6" fill="#fff"/>
    </g>
    <g fill="#111">
      <rect x="${cx - trunk / 2}" y="${top + (G - top) * 0.3}" width="${trunk}" height="${(G - top) * 0.7}"/>
      ${crown}
    </g>
    <line x1="0" y1="${G}" x2="${SC.W}" y2="${G}" stroke="#888" stroke-width="0.25"/>
    <text x="${SC.W / 2}" y="${G + 1.7}" font-size="1.5" fill="#888" text-anchor="middle">Haus ≈ 9 m</text>
  </svg>`;
}

function jumpTo(key) {
  const v = state.visits[key]; if (!v) return;
  $('profile').classList.add('hidden'); $('stats').classList.add('hidden');
  map.setView([v.lat, v.lon], 19);
  openTree(treeFromVisit(v));
}
$('btnMe').onclick = () => openProfile(false);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
renderPoints();
renderMe();
refreshMarkers();
checkReturnedReport();
if (!state.profile || !state.profile.name) openProfile(true);
</script>
