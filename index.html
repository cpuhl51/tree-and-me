<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree and me</title>
<meta name="theme-color" content="#2f6b3a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --green:#2f6b3a; --green2:#e6f1e7; --ink:#1d241e; --quiet:#5d6b5f; --bg:#fff; --line:#d9e0da; --warn:#b26a00; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--green); color:#fff; z-index:1000; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:8px 10px; font-size:14px; }
  #pts { font-weight:700; font-size:15px; }
  #map { position:fixed; top:52px; bottom:0; left:0; right:0; }
  #fab { position:fixed; right:12px; bottom:20px; z-index:900; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  #fab button, #fab label { background:#fff; border:1px solid var(--line); border-radius:24px; padding:10px 14px; font-size:14px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #hint { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:900; background:#fff; border:1px solid var(--line); border-radius:16px; padding:6px 12px; font-size:13px; color:var(--quiet); display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:1100; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -2px 12px rgba(0,0,0,.2); padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:70vh; overflow-y:auto; }
  .panel { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:1050; background:#fff; overflow-y:auto; padding:16px; }
  .hidden { display:none !important; }
  .sheet h2, .panel h2 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--quiet); font-size:13px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; margin:10px 0; }
  .grid b { color:var(--quiet); font-weight:500; }
  .btn { display:block; width:100%; margin-top:8px; padding:13px; border-radius:10px; border:0; font-size:15px; font-weight:600; background:var(--green); color:#fff; }
  .btn.sec { background:var(--green2); color:var(--green); }
  .btn.ghost { background:none; color:var(--quiet); font-weight:500; }
  .btn:disabled { opacity:.45; }
  .ok { background:var(--green2); color:var(--green); padding:10px; border-radius:10px; font-size:14px; margin:8px 0; }
  .warn { background:#fff4e0; color:var(--warn); padding:10px; border-radius:10px; font-size:14px; margin:8px 0; }
  .close { float:right; background:none; border:0; font-size:22px; color:var(--quiet); }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:1300; background:#1d241e; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; max-width:90vw; text-align:center; }
  #busy { position:fixed; inset:0; z-index:1400; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  .tree-ic { font-size:22px; line-height:28px; text-align:center; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .tree-ic.visited { background:rgba(47,107,58,.25); border:2px solid var(--green); border-radius:50%; }
  table.stat { width:100%; border-collapse:collapse; font-size:14px; margin:6px 0 16px; }
  table.stat td { border-bottom:1px solid var(--line); padding:6px 4px; }
  table.stat td:last-child { text-align:right; }
  .big { font-size:28px; font-weight:700; color:var(--green); }
  .small { font-size:12px; color:var(--quiet); }
  img.thumb { max-width:100%; border-radius:10px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>🌳 Tree and me</h1>
  <span id="pts">0 P</span>
  <button id="btnStats">Statistik</button>
</header>
<div id="map"></div>
<div id="hint"></div>
<div id="fab">
  <label><input type="checkbox" id="testMode"> Testmodus</label>
  <button id="btnLocate">◎ Mein Standort</button>
</div>
<div id="sheet" class="sheet hidden"></div>
<div id="stats" class="panel hidden"></div>
<div id="toast"></div>
<div id="busy" class="hidden">Bitte warten …</div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// ---------- Einstellungen ----------
const CFG = {
  radius: 15,          // max. Abstand zum Baum in Metern
  matchRadius: 30,     // Umkreis, in dem eine gelesene Nummer gesucht wird
  minZoom: 16,         // ab dieser Zoomstufe werden Bäume geladen
  maxFeatures: 1500,
  wfs: 'https://data.wien.gv.at/daten/geo', // später ggf. eigener Server/Worker
  reportWorkdays: 3
};

// ---------- Speicher ----------
const STORE_KEY = 'tam_v1';
let state = loadState();
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || freshState(); } catch { return freshState(); }
}
function freshState() { return { visits: {}, districts: [] }; }
function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); renderPoints(); }

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tam', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function putPhoto(key, blob) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function getPhoto(key) {
  const db = await idb();
  return new Promise((res, rej) => { const r = db.transaction('photos').objectStore('photos').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}

// ---------- Hilfen ----------
const $ = id => document.getElementById(id);
function toast(msg, ms = 2800) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
function busy(on, txt) { $('busy').textContent = txt || 'Bitte warten …'; $('busy').classList.toggle('hidden', !on); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function addWorkdays(date, n) { // ohne Feiertage (Annahme für den Prototyp)
  const d = new Date(date);
  while (n > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n--; }
  return d;
}
const fmtDate = d => new Date(d).toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric' });
const normNum = s => String(s ?? '').replace(/\D/g, '').replace(/^0+/, '');

// ---------- Baum-Kategorien ----------
const NADEL = ['pinus','picea','abies','taxus','thuja','juniperus','cedrus','larix','metasequoia','pseudotsuga','sequoiadendron','sequoia','taxodium','chamaecyparis','cupressus','cryptomeria','tsuga','platycladus','sciadopitys','cupressocyparis','calocedrus'];
const OBST = ['malus','pyrus','juglans','morus','cydonia','mespilus','castanea','ficus'];
const OBST_PRUNUS = ['avium','cerasus','domestica','armeniaca','persica','insititia','dulcis'];
function category(art) {
  const w = String(art || '').toLowerCase().replace(/[^a-zäöüß\s]/g, ' ').trim().split(/\s+/).filter(x => x !== 'x');
  const g = w[0] || '', sp = w[1] || '';
  if (NADEL.includes(g)) return 'nadel';
  if (OBST.includes(g) || (g === 'prunus' && OBST_PRUNUS.includes(sp))) return 'obst';
  return 'laub'; // inkl. Ginkgo
}
const EMOJI = { laub:'🌳', nadel:'🌲', obst:'🍎' };
const KAT_NAME = { laub:'Laubbaum', nadel:'Nadelbaum', obst:'Obstbaum' };
const genusOf = art => (String(art || '').trim().split(/\s+/)[0] || 'unbekannt');

// ---------- Karte ----------
const map = L.map('map', { zoomControl: false }).setView([48.2082, 16.3738], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20, maxNativeZoom: 19,
  attribution: '© OpenStreetMap · Baumdaten: Stadt Wien – data.wien.gv.at (CC BY 4.0)'
}).addTo(map);

const trees = new Map();    // key -> {key, props, latlng, marker}
let me = null, meMarker = null, accCircle = null, selected = null;

function treeKey(p) { return `${p.BEZIRK}|${p.OBJEKT_STRASSE}|${p.BAUMNUMMER}`; }

function iconFor(t) {
  const kat = category(t.props.GATTUNG_ART);
  const visited = !!state.visits[t.key];
  return L.divIcon({ className: `tree-ic ${visited ? 'visited' : ''}`, html: EMOJI[kat], iconSize: [30, 30] });
}

let loadTimer = null, loading = false;
map.on('moveend', () => { clearTimeout(loadTimer); loadTimer = setTimeout(loadTrees, 400); });

async function loadTrees() {
  if (map.getZoom() < CFG.minZoom) { showHint('Näher hineinzoomen, um Bäume zu sehen'); return; }
  showHint('');
  if (loading) return; loading = true;
  const b = map.getBounds();
  const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v => v.toFixed(6)).join(',');
  const url = `${CFG.wfs}?service=WFS&request=GetFeature&version=1.0.0&typeName=ogdwien:BAUMKATOGD&srsName=EPSG:4326&outputFormat=json&maxFeatures=${CFG.maxFeatures}&bbox=${bbox},EPSG:4326`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const gj = await r.json();
    for (const f of gj.features || []) {
      const p = f.properties || {}; const c = f.geometry && f.geometry.coordinates;
      if (!c) continue;
      const key = treeKey(p);
      if (trees.has(key)) continue;
      const t = { key, props: p, latlng: L.latLng(c[1], c[0]) };
      t.marker = L.marker(t.latlng, { icon: iconFor(t) }).addTo(map).on('click', () => openTree(t));
      trees.set(key, t);
    }
    if ((gj.features || []).length >= CFG.maxFeatures) showHint('Sehr viele Bäume – näher zoomen für alle');
  } catch (e) {
    console.error(e);
    toast('Baumdaten konnten nicht geladen werden (' + e.message + ')', 4500);
  } finally { loading = false; }
}
function showHint(txt) { const h = $('hint'); h.textContent = txt; h.style.display = txt ? 'block' : 'none'; }

// ---------- Standort ----------
function setMe(latlng, acc) {
  me = { latlng, acc };
  if (!meMarker) {
    meMarker = L.circleMarker(latlng, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
    accCircle = L.circle(latlng, { radius: acc, color: '#1a73e8', weight: 1, fillOpacity: .08 }).addTo(map);
  } else { meMarker.setLatLng(latlng); accCircle.setLatLng(latlng).setRadius(acc); }
  if (selected) openTree(selected); // Abstand aktualisieren
}
let firstFix = true;
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(pos => {
    if ($('testMode').checked) return;
    setMe(L.latLng(pos.coords.latitude, pos.coords.longitude), pos.coords.accuracy);
    if (firstFix) { firstFix = false; map.setView(me.latlng, 18); }
  }, err => toast('Kein GPS: ' + err.message + ' – Testmodus nutzen'), { enableHighAccuracy: true, maximumAge: 5000 });
}
$('btnLocate').onclick = () => { if (me) map.setView(me.latlng, 18); else toast('Noch kein Standort'); };
$('testMode').onchange = e => toast(e.target.checked ? 'Testmodus: Tippe auf die Karte, um deinen Standort zu setzen' : 'Testmodus aus – GPS aktiv');
map.on('click', e => { if ($('testMode').checked) setMe(e.latlng, 5); });

function inRange(t) {
  if (!me) return false;
  const allowed = CFG.radius + Math.min(me.acc || 0, 15);
  return dist(me.latlng, t.latlng) <= allowed;
}

// ---------- Baum-Blatt ----------
function closeSheet() { $('sheet').classList.add('hidden'); selected = null; }
function openTree(t) {
  selected = t;
  const p = t.props, kat = category(p.GATTUNG_ART), v = state.visits[t.key];
  const d = me ? Math.round(dist(me.latlng, t.latlng)) : null;
  let html = `<button class="close" onclick="closeSheet()">×</button>
    <h2>${EMOJI[kat]} ${esc(p.GATTUNG_ART || 'Unbekannte Art')}</h2>
    <div class="meta">${KAT_NAME[kat]} · ${esc(p.OBJEKT_STRASSE)} · ${esc(p.BEZIRK)}. Bezirk</div>
    <div class="grid">
      <b>Baumnummer</b><span>${esc(p.BAUMNUMMER)}</span>
      <b>Pflanzjahr</b><span>${esc(p.PFLANZJAHR_TXT ?? p.PFLANZJAHR)}</span>
      <b>Stammumfang</b><span>${esc(p.STAMMUMFANG_TXT ?? p.STAMMUMFANG)}</span>
      <b>Höhe</b><span>${esc(p.BAUMHOEHE_TXT ?? '')}</span>
      <b>Krone</b><span>${esc(p.KRONENDURCHMESSER_TXT ?? '')}</span>
      <b>Entfernung</b><span>${d === null ? 'Standort unbekannt' : d + ' m'}</span>
    </div>`;
  if (v) {
    html += `<div class="ok">✔ Besucht am ${fmtDate(v.ts)} · ${v.points} Punkte${v.pending ? ` (vorläufig bis ${fmtDate(v.pendingUntil)})` : ''}</div>
      <button class="btn sec" onclick="startCam('selfie')">🤳 Foto mit dem Baum ${v.selfie ? 'ersetzen' : 'machen'}</button>
      <button class="btn ghost" disabled>✉️ Nachricht für den nächsten Besucher (kommt mit dem Server)</button>
      <div id="selfiePrev"></div>`;
    if (v.selfie) getPhoto('selfie:' + t.key).then(b => { if (b && $('selfiePrev')) $('selfiePrev').innerHTML = `<img class="thumb" src="${URL.createObjectURL(b)}">`; });
  } else {
    const ok = inRange(t);
    if (!ok) html += `<div class="warn">Geh näher hin (max. ${CFG.radius} m), um den Baum zu scannen.</div>`;
    html += `<button class="btn" ${ok ? '' : 'disabled'} onclick="startCam('ocr')">📷 Plakette scannen</button>
      <button class="btn sec" ${ok ? '' : 'disabled'} onclick="planB()">Plakette geht nicht</button>`;
  }
  $('sheet').innerHTML = html;
  $('sheet').classList.remove('hidden');
}

// ---------- Kamera ----------
let camMode = null, planBReason = null, lastPhoto = null;
function startCam(mode) { camMode = mode; $('camInput').value = ''; $('camInput').click(); }
$('camInput').onchange = async e => {
  const file = e.target.files && e.target.files[0];
  if (!file || !selected) return;
  const t = selected;
  if (camMode === 'selfie') {
    const blob = await shrink(file, 1600);
    await putPhoto('selfie:' + t.key, blob);
    state.visits[t.key].selfie = true; saveState(); openTree(t); toast('Foto gespeichert');
    return;
  }
  if (camMode === 'planb') {
    const blob = await shrink(file, 1600);
    finishPlanB(t, blob);
    return;
  }
  // OCR
  lastPhoto = await shrink(file, 1600);
  busy(true, 'Lese Plakette …');
  try {
    const numbers = await ocr(file);
    busy(false);
    const hit = matchNumber(t, numbers);
    if (hit === t) return recordVisit(t, 'ocr', null, lastPhoto);
    if (hit) {
      if (confirm(`Die Plakette passt zu Baum Nr. ${hit.props.BAUMNUMMER} (${hit.props.GATTUNG_ART}) in der Nähe. Diesen Baum werten?`)) return recordVisit(hit, 'ocr', null, lastPhoto);
      return;
    }
    ocrFailed(t, numbers);
  } catch (err) {
    busy(false); console.error(err); ocrFailed(t, []);
  }
};

async function shrink(file, max) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}

let ocrWorker = null;
async function ocr(file) {
  if (!ocrWorker) {
    ocrWorker = await Tesseract.createWorker('eng');
    await ocrWorker.setParameters({ tessedit_char_whitelist: '0123456789' });
  }
  // Graustufen + Kontrast für bessere Erkennung
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const ctx = c.getContext('2d'); ctx.filter = 'grayscale(1) contrast(1.6)'; ctx.drawImage(img, 0, 0, c.width, c.height);
  const { data } = await ocrWorker.recognize(c);
  const found = (data.text.match(/\d+/g) || []).map(normNum).filter(Boolean);
  console.log('OCR:', data.text, found);
  return [...new Set(found)];
}

function matchNumber(t, numbers) {
  if (!numbers.length) return null;
  if (numbers.includes(normNum(t.props.BAUMNUMMER))) return t;
  const ref = me ? me.latlng : t.latlng;
  for (const other of trees.values()) {
    if (other === t || state.visits[other.key]) continue;
    if (dist(ref, other.latlng) <= CFG.matchRadius && numbers.includes(normNum(other.props.BAUMNUMMER))) return other;
  }
  return null;
}

function ocrFailed(t, numbers) {
  $('sheet').innerHTML = `<button class="close" onclick="openTree(selected)">×</button>
    <h2>Plakette nicht erkannt</h2>
    <div class="meta">${numbers.length ? 'Gelesen: ' + esc(numbers.join(', ')) + ' – passt zu keinem Baum in der Nähe.' : 'Es wurde keine Nummer gelesen.'}</div>
    <button class="btn" onclick="startCam('ocr')">📷 Nochmal versuchen</button>
    <button class="btn sec" onclick="planB(true)">Plakette geht nicht (Foto verwenden)</button>`;
}

// ---------- Plan B ----------
function planB(reusePhoto) {
  const t = selected;
  $('sheet').innerHTML = `<button class="close" onclick="openTree(selected)">×</button>
    <h2>Was ist mit der Plakette?</h2>
    <div class="meta">Ein Foto des Baums ist Pflicht.</div>
    <button class="btn sec" onclick="chooseReason('fehlt', ${!!reusePhoto})">Plakette fehlt</button>
    <button class="btn sec" onclick="chooseReason('unlesbar', ${!!reusePhoto})">Plakette nicht lesbar</button>
    <button class="btn sec" onclick="chooseReason('zu_hoch', ${!!reusePhoto})">Plakette zu hoch</button>`;
}
function chooseReason(reason, reuse) {
  planBReason = reason;
  if (reuse && lastPhoto) return finishPlanB(selected, lastPhoto);
  startCam('planb');
}
function finishPlanB(t, blob) {
  if (!blob) { toast('Ohne Foto geht es nicht'); return; }
  recordVisit(t, 'planb', planBReason, blob);
}

// ---------- Besuch & Punkte ----------
async function recordVisit(t, method, reason, photo) {
  if (state.visits[t.key]) { toast('Diesen Baum hast du schon besucht – keine Punkte mehr'); return openTree(t); }
  const p = t.props, bez = String(p.BEZIRK);
  let pts = 0; const why = [];
  const report = method === 'planb' && (reason === 'fehlt' || reason === 'unlesbar');
  if (report) { pts += 5; why.push('Meldung +5 (vorläufig)'); }
  else { pts += 1; why.push('Besuch +1'); }
  if (!state.districts.includes(bez)) { pts += 10; why.push('neuer Bezirk +10'); state.districts.push(bez); }
  const now = new Date();
  state.visits[t.key] = {
    key: t.key, nummer: p.BAUMNUMMER, art: p.GATTUNG_ART, gattung: genusOf(p.GATTUNG_ART), kat: category(p.GATTUNG_ART),
    bezirk: bez, strasse: p.OBJEKT_STRASSE, lat: t.latlng.lat, lon: t.latlng.lng, ts: now.toISOString(),
    method, reason, points: pts, pending: report, pendingUntil: report ? addWorkdays(now, CFG.reportWorkdays).toISOString() : null,
    reportQueued: report, selfie: false
  };
  if (photo) await putPhoto('scan:' + t.key, photo);
  saveState();
  t.marker.setIcon(iconFor(t));
  selected = t; openTree(t);
  toast('🎉 ' + why.join(' · ') + (report ? ' – Meldung an die Stadtgärten vorgemerkt' : ''), 4000);
}

function totals() {
  const v = Object.values(state.visits);
  const sure = v.filter(x => !x.pending).reduce((s, x) => s + x.points, 0);
  const pend = v.filter(x => x.pending).reduce((s, x) => s + x.points, 0);
  return { count: v.length, sure, pend, all: sure + pend };
}
function renderPoints() { $('pts').textContent = totals().all + ' P'; }

// ---------- Statistik ----------
$('btnStats').onclick = () => {
  const p = $('stats');
  if (!p.classList.contains('hidden')) return p.classList.add('hidden');
  const v = Object.values(state.visits), tt = totals();
  const byBez = {}, byGen = {};
  v.forEach(x => { byBez[x.bezirk] = (byBez[x.bezirk] || 0) + 1; byGen[x.gattung] = (byGen[x.gattung] || 0) + 1; });
  const rows = (o, label) => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<tr><td>${esc(label(k))}</td><td>${n}</td></tr>`).join('') || '<tr><td>noch nichts</td><td></td></tr>';
  p.innerHTML = `<button class="close" onclick="$('stats').classList.add('hidden')">×</button>
    <h2>Deine Statistik</h2>
    <div class="big">${tt.all} Punkte</div>
    <div class="small">${tt.pend ? `davon ${tt.pend} vorläufig (Meldungen werden ${CFG.reportWorkdays} Werktage geprüft)` : ''}</div>
    <p>${tt.count} Bäume besucht · ${state.districts.length} von 23 Bezirken</p>
    <h3>Bezirke</h3><table class="stat">${rows(byBez, k => k + '. Bezirk')}</table>
    <h3>Gattungen</h3><table class="stat">${rows(byGen, k => k)}</table>
    <div class="small">Vergleich mit der Gesamtzahl in Wien und die Rangliste kommen mit dem Server.</div>
    <h3>Sicherung</h3>
    <button class="btn sec" onclick="exportData()">Besuche exportieren (JSON)</button>
    <button class="btn sec" onclick="$('importFile').click()">Besuche importieren</button>
    <input type="file" id="importFile" accept="application/json" hidden onchange="importData(this.files[0])">
    <p class="small">Fotos bleiben vorerst nur auf diesem Gerät. Baumdaten: Stadt Wien – data.wien.gv.at (CC BY 4.0). Karte © OpenStreetMap.</p>`;
  p.classList.remove('hidden');
};
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tree-and-me-sicherung.json'; a.click();
}
async function importData(file) {
  if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!s.visits) throw new Error('Keine Besuche gefunden');
    state = s; saveState(); trees.forEach(t => t.marker.setIcon(iconFor(t)));
    toast('Import erfolgreich'); $('stats').classList.add('hidden');
  } catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
}

renderPoints();
</script>
</body>
</html>
